# Local build overlay for the image-only production stack.
services:
  caddy:
    build:
      context: .
      dockerfile: Frontend/Dockerfile.production
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        CADDY_CONFIG: deploy/Caddyfile

  api:
    build:
      context: ./Backend

  minio-bootstrap:
    build:
      context: .
      dockerfile: deploy/minio-bootstrap.Dockerfile

  minio:
    build:
      context: .
      dockerfile: deploy/minio.Dockerfile
