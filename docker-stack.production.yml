version: "3.8"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    image: ${FRONTEND_IMAGE:-hammebsb/racletty-frontend:v1.0.0}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:?Set FILES_DOMAIN}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
    networks: [traefik_public, proxy, app_network]
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik_public
        - traefik.http.routers.racletty.rule=Host(`${APP_DOMAIN}`) || Host(`${FILES_DOMAIN}`)
        - traefik.http.routers.racletty.entrypoints=websecure
        - traefik.http.routers.racletty.tls=true
        - traefik.http.routers.racletty.tls.certresolver=le
        - traefik.http.routers.racletty.service=racletty
        - traefik.http.services.racletty.loadbalancer.server.port=80
        - traefik.http.routers.racletty-http.rule=Host(`${APP_DOMAIN}`) || Host(`${FILES_DOMAIN}`)
        - traefik.http.routers.racletty-http.entrypoints=web
        - traefik.http.routers.racletty-http.middlewares=racletty-https
        - traefik.http.routers.racletty-http.service=racletty
        - traefik.http.middlewares.racletty-https.redirectscheme.scheme=https
        - traefik.http.middlewares.racletty-https.redirectscheme.permanent=true

  api:
    image: ${API_IMAGE:-hammebsb/racletty-backend:v1.0.0}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      APPLICATION_ENVIRONMENT: production
      PROXY_NETWORK: ${PROXY_NETWORK:?Set PROXY_NETWORK to the frontend/API overlay subnet}
      AllowedHosts: ${APP_DOMAIN:?Set APP_DOMAIN}
      DataProtection__KeysPath: /var/lib/racletty/keys
      ConnectionStrings__DefaultConnection: Host=db;Port=7584;Database=racletty;Username=racletty;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__PublicEndpoint: ${FILES_PUBLIC_ENDPOINT:?Set FILES_PUBLIC_ENDPOINT}
      ObjectStorage__Region: us-east-1
      ObjectStorage__Bucket: racletty-private
      ObjectStorage__AccessKey: ${MINIO_APP_USER:?Set MINIO_APP_USER}
      ObjectStorage__SecretKey: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD}
      ObjectStorage__ForcePathStyle: "true"
    volumes: [data-protection:/var/lib/racletty/keys]
    networks: [proxy, data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "Host: ${APP_DOMAIN:?Set APP_DOMAIN}", "http://127.0.0.1:1818/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "1"
          memory: 1536M
      restart_policy:
        condition: on-failure
        delay: 5s

  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the immutable PostgreSQL image reference}
    command: ["postgres", "-c", "port=7584"]
    environment:
      POSTGRES_DB: racletty
      POSTGRES_USER: racletty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 7584 -U racletty -d racletty"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "1"
          memory: 1536M
      restart_policy:
        condition: on-failure
        delay: 5s

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to the immutable MinIO image reference}
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    networks:
      app_network:
        aliases: [minio]
      data:
        aliases: [minio]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "1"
          memory: 1536M
      restart_policy:
        condition: on-failure
        delay: 5s

  minio-bootstrap:
    image: ${MINIO_BOOTSTRAP_IMAGE:?Set MINIO_BOOTSTRAP_IMAGE to an immutable image reference}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD}
    networks: [data]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 10s

  backup-tools:
    image: ${BACKUP_TOOLS_IMAGE:?Set BACKUP_TOOLS_IMAGE to an immutable image reference}
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    environment:
      PGHOST: db
      PGPORT: "7584"
      PGDATABASE: racletty
      PGUSER: racletty
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_CONTENT: ${RCLONE_CONFIG_CONTENT:-}
      RACLETTY_STACK_NAME: ${RACLETTY_STACK_NAME:?Set RACLETTY_STACK_NAME to the Portainer stack name}
      RACLETTY_RELEASE_COMMIT: ${COMMIT:?Set COMMIT}
      RACLETTY_API_IMAGE: ${API_IMAGE:?Set API_IMAGE}
      RACLETTY_FRONTEND_IMAGE: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
      RACLETTY_MINIO_BOOTSTRAP_IMAGE: ${MINIO_BOOTSTRAP_IMAGE:?Set MINIO_BOOTSTRAP_IMAGE}
      RACLETTY_BACKUP_TOOLS_IMAGE: ${BACKUP_TOOLS_IMAGE:?Set BACKUP_TOOLS_IMAGE}
      RACLETTY_POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
      RACLETTY_MINIO_IMAGE: ${MINIO_IMAGE:?Set MINIO_IMAGE}
      RACLETTY_MINIO_MC_IMAGE: ${MINIO_MC_IMAGE:?Set MINIO_MC_IMAGE}
    volumes:
      - minio-data:/source/minio:ro
      - data-protection:/source/data-protection:ro
      - backup-data:/backups
    networks: [data]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s

volumes:
  postgres-data:
  minio-data:
  data-protection:
  backup-data:

networks:
  traefik_public:
    name: traefik_public
    external: true
  app_network:
    driver: overlay
    internal: true
  proxy:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_NETWORK:?Set PROXY_NETWORK to a non-overlapping private subnet}
  data:
    driver: overlay
    internal: true
