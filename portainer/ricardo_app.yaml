# Racletty application stack.
#
# Deploy AFTER portainer/postgresql18.yaml. This stack owns the frontend
# (Caddy), API, MinIO, MinIO bootstrap and backup tooling; the database lives
# in the separate postgresql18 stack.
#
# Prerequisites on the Swarm manager:
#   - existing external overlay network "traefik_public" attached to Traefik
#   - existing external overlay network "app_network" (shared with postgresql18)
# This stack creates its private "proxy", "data" and "storage" overlays.
#
# Host values default to:
#   APP_DOMAIN             ricardo.centsfy.com
#   FILES_DOMAIN           files.centsfy.com
#   APP_ORIGIN             https://ricardo.centsfy.com
#   FILES_PUBLIC_ENDPOINT  https://files.centsfy.com
# Override them in Portainer if the deployment uses other hostnames.
#
# Set POSTGRES_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_APP_USER
# and MINIO_APP_PASSWORD in the Portainer stack environment. These values
# must match the database stack and MinIO bootstrap settings.
# PROXY_NETWORK defaults to 10.251.251.0/24. Override it if that subnet
# overlaps the host or any other network.
#
# RACLETTY_STACK_NAME defaults to "racletty". Set COMMIT to the full SHA of
# the deployed source so backup metadata records the correct release.
#
# The stack file contains no credential defaults. Supply credentials through
# Portainer environment settings and keep those settings private.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    image: xukelho/racletty-frontend:v1.0.1
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-ricardo.centsfy.com}
      FILES_DOMAIN: ${FILES_DOMAIN:-files.centsfy.com}
      APP_ORIGIN: ${APP_ORIGIN:-https://ricardo.centsfy.com}
    networks: [traefik_public, proxy, storage]
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik_public
        - traefik.http.routers.racletty.rule=Host(`${APP_DOMAIN:-ricardo.centsfy.com}`) || Host(`${FILES_DOMAIN:-files.centsfy.com}`)
        - traefik.http.routers.racletty.entrypoints=websecure
        - traefik.http.routers.racletty.tls=true
        - traefik.http.routers.racletty.tls.certresolver=le
        - traefik.http.routers.racletty.service=racletty
        - traefik.http.services.racletty.loadbalancer.server.port=80
        - traefik.http.routers.racletty-http.rule=Host(`${APP_DOMAIN:-ricardo.centsfy.com}`) || Host(`${FILES_DOMAIN:-files.centsfy.com}`)
        - traefik.http.routers.racletty-http.entrypoints=web
        - traefik.http.routers.racletty-http.middlewares=racletty-https
        - traefik.http.routers.racletty-http.service=racletty
        - traefik.http.middlewares.racletty-https.redirectscheme.scheme=https
        - traefik.http.middlewares.racletty-https.redirectscheme.permanent=true

  api:
    image: xukelho/racletty-backend:v1.0.1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      APPLICATION_ENVIRONMENT: production
      PROXY_NETWORK: ${PROXY_NETWORK:-10.251.251.0/24}
      AllowedHosts: ${APP_DOMAIN:-ricardo.centsfy.com}
      DataProtection__KeysPath: /var/lib/racletty/keys
      ConnectionStrings__DefaultConnection: Host=postgres18;Port=7584;Database=racletty;Username=racletty;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__PublicEndpoint: ${FILES_PUBLIC_ENDPOINT:-https://files.centsfy.com}
      ObjectStorage__Region: us-east-1
      ObjectStorage__Bucket: racletty-private
      ObjectStorage__AccessKey: ${MINIO_APP_USER:?Set MINIO_APP_USER}
      ObjectStorage__SecretKey: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD}
      ObjectStorage__ForcePathStyle: "true"
    volumes: [data-protection:/var/lib/racletty/keys]
    networks: [proxy, data, app_network]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "Host: ${APP_DOMAIN:-ricardo.centsfy.com}", "http://127.0.0.1:1818/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      labels:
        - traefik.enable=false
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "1"
          memory: 1536M
      restart_policy:
        condition: on-failure
        delay: 5s

  minio:
    image: xukelho/racletty-minio:v1.0.1
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    networks:
      storage:
        aliases: [minio]
      data:
        aliases: [minio]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      labels:
        - traefik.enable=false
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "1"
          memory: 1536M
      restart_policy:
        condition: on-failure
        delay: 5s

  minio-bootstrap:
    image: xukelho/racletty-minio-bootstrap:v1.0.1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD}
    networks: [data]
    logging: *default-logging
    deploy:
      mode: replicated-job
      labels:
        - traefik.enable=false
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 10s

  backup-tools:
    image: xukelho/racletty-backup-tools:v1.0.1
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    environment:
      PGHOST: postgres18
      PGPORT: "7584"
      PGDATABASE: racletty
      PGUSER: racletty
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_CONTENT: ${RCLONE_CONFIG_CONTENT:-}
      RACLETTY_STACK_NAME: ${RACLETTY_STACK_NAME:-racletty}
      RACLETTY_RELEASE_COMMIT: ${COMMIT:?Set COMMIT to the full release commit SHA}
      RACLETTY_API_IMAGE: xukelho/racletty-backend:v1.0.1
      RACLETTY_FRONTEND_IMAGE: xukelho/racletty-frontend:v1.0.1
      RACLETTY_MINIO_BOOTSTRAP_IMAGE: xukelho/racletty-minio-bootstrap:v1.0.1
      RACLETTY_BACKUP_TOOLS_IMAGE: xukelho/racletty-backup-tools:v1.0.1
      RACLETTY_POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:18}
      RACLETTY_MINIO_IMAGE: xukelho/racletty-minio:v1.0.1
      RACLETTY_MINIO_MC_IMAGE: xukelho/racletty-mc:v1.0.1
    volumes:
      - minio-data:/source/minio:ro
      - data-protection:/source/data-protection:ro
      - backup-data:/backups
    networks: [data, app_network]
    logging: *default-logging
    deploy:
      labels:
        - traefik.enable=false
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s

volumes:
  minio-data:
  data-protection:
  backup-data:

networks:
  traefik_public:
    name: traefik_public
    external: true
  app_network:
    name: app_network
    external: true
  proxy:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_NETWORK:-10.251.251.0/24}
  data:
    driver: overlay
    internal: true
  storage:
    driver: overlay
    internal: true
