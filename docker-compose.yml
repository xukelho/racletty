name: racletty

# The local default lives here. A pipeline can provide APPLICATION_ENVIRONMENT
# (for example, "staging" or "production") and Compose will pass that value
# to every service below when it creates the stack.
x-application-environment: &application-environment
  APPLICATION_ENVIRONMENT: "${APPLICATION_ENVIRONMENT:-development}"
  ASPNETCORE_ENVIRONMENT: "${APPLICATION_ENVIRONMENT:-development}"

services:
  racletty-frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "5385:5385"
    volumes:
      - ./Frontend:/workspace/Frontend
      - ./Frontend 2:/workspace/Frontend 2
      - racletty-frontend-node-modules:/workspace/Frontend/node_modules
    environment:
      <<: *application-environment
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://racletty-api:1818"
      VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"

  racletty-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "1818:1818"
    environment:
      <<: *application-environment
      ConnectionStrings__DefaultConnection: "Host=racletty-db;Port=7584;Database=racletty;Username=racletty;Password=racletty_dev_password"
      ObjectStorage__Endpoint: "http://racletty-minio:9000"
      ObjectStorage__PublicEndpoint: "http://localhost:9000"
      ObjectStorage__Region: "us-east-1"
      ObjectStorage__Bucket: "racletty-private"
      ObjectStorage__AccessKey: "racletty_dev"
      ObjectStorage__SecretKey: "racletty_dev_password"
      ObjectStorage__ForcePathStyle: "true"
    depends_on:
      racletty-db:
        condition: service_healthy
      racletty-minio-bootstrap:
        condition: service_completed_successfully

  racletty-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      <<: *application-environment
      MINIO_ROOT_USER: racletty_dev
      MINIO_ROOT_PASSWORD: racletty_dev_password
    volumes:
      - racletty-objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  racletty-minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      racletty-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      <<: *application-environment
    command:
      - >-
        mc alias set local http://racletty-minio:9000 racletty_dev racletty_dev_password &&
        mc mb --ignore-existing local/racletty-private &&
        mc anonymous set none local/racletty-private

  racletty-db:
    build:
      context: ./Database
      dockerfile: Dockerfile
    ports:
      # Bind only on the host loopback interface to avoid exposing the
      # development database to the local network.
      - "127.0.0.1:5837:7584"
    environment:
      <<: *application-environment
      POSTGRES_DB: racletty
      POSTGRES_USER: racletty
      POSTGRES_PASSWORD: racletty_dev_password
    volumes:
      - racletty-db:/var/lib/postgresql/data

volumes:
  racletty-frontend-node-modules:
    name: racletty-frontend-node-modules
  racletty-db:
    name: racletty-db
  racletty-objects:
    name: racletty-objects
